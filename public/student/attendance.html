<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Attendance — SMS</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    requireAuth('student');
    renderShell('student');
  </script>

  <template id="attendance-template">
    <h1>My Attendance</h1>
    <div class="card stat-card" style="max-width:280px;">
      <span class="stat-label">Overall attendance</span>
      <span class="stat-value" id="pct-value">—</span>
      <div class="progress-bar" style="margin-top:6px;"><div id="pct-bar" style="width:0%;"></div></div>
    </div>
    <div class="card">
      <h3>History</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Status</th></tr></thead>
          <tbody id="history-tbody"></tbody>
        </table>
      </div>
    </div>
  </template>

  <script>
    async function init() {
      document.getElementById('page-mount').appendChild(document.getElementById('attendance-template').content.cloneNode(true));
      const user = getCurrentUser();
      try {
        const { records, summary } = await api.get(`/attendance/student/${user.studentProfile}`);
        document.getElementById('pct-value').textContent = summary.percentage + '%';
        document.getElementById('pct-bar').style.width = summary.percentage + '%';

        document.getElementById('history-tbody').innerHTML = records.length
          ? records.map((r) => `<tr><td>${fmtDate(r.date)}</td><td><span class="pill pill-${r.status}">${r.status}</span></td></tr>`).join('')
          : `<tr><td colspan="2"><div class="empty-state">No attendance recorded yet.</div></td></tr>`;
      } catch (err) {
        document.getElementById('page-mount').innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
    }
    init();
  </script>
</body>
</html>
