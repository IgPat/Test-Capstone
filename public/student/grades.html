<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Grades — SMS</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    requireAuth('student');
    renderShell('student');
  </script>

  <template id="grades-template">
    <h1>My Report Card</h1>
    <p class="muted">Term-by-term breakdown of your scores, averages and letter grade.</p>
    <div class="card" id="report-card"></div>
  </template>

  <script>
    async function init() {
      document.getElementById('page-mount').appendChild(document.getElementById('grades-template').content.cloneNode(true));
      const user = getCurrentUser();
      const container = document.getElementById('report-card');
      try {
        const reportCard = await api.get(`/grades/student/${user.studentProfile}`);
        container.innerHTML = reportCard.length
          ? reportCard.map((t) => `
              <div class="term-block">
                <div class="flex-between">
                  <strong>${escapeHtml(t.term)}</strong>
                  <span class="pill pill-active">${t.average}% · Grade ${t.grade}</span>
                </div>
                <table style="margin-top:8px;">
                  <thead><tr><th>Subject</th><th>Score</th><th>%</th><th>Remark</th></tr></thead>
                  <tbody>
                    ${t.subjects.map((sub) => `
                      <tr>
                        <td>${escapeHtml(sub.subject)}</td>
                        <td>${sub.score}/${sub.maxScore}</td>
                        <td>${sub.percentage}%</td>
                        <td>${escapeHtml(sub.remark || '—')}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `).join('')
          : '<div class="empty-state">No grades recorded yet.</div>';
      } catch (err) {
        container.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
    }
    init();
  </script>
</body>
</html>
